name: Build waleed remix (APK + AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: .
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # فك الضغط: لو المشروع مرفوع كملف ZIP في جذر الريبو يتم فكه وإيجاد مجلد المشروع تلقائيًا
      - name: Unzip project if uploaded as ZIP
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Project found in repo root"
          else
            ZIP=$(ls -1t *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::No project found. Upload the project files or a .zip to the repo root"; exit 1
            fi
            echo "Unzipping $ZIP"
            rm -rf _src && mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            FOUND=$(find _src -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::settings.gradle(.kts) not found inside $ZIP"; exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # إصلاح أخطاء الـ SDK/التراخيص: تثبيت المنصة وأدوات البناء المطلوبة
      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode=summary \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            assembleRelease bundleRelease 2>&1 | tee build.log

      # عند فشل البناء: يعرض الأخطاء مختصرة ويرفع اللوج كامل
      - name: Show build errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== ERRORS ====="
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not resolve" -A4 build.log | head -n 120 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "dist/waleed-remix-${VERSION_NAME}.apk"
          cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" "dist/waleed-remix-${VERSION_NAME}.aab"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waleed-remix-apk-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: waleed-remix-aab-${{ env.VERSION_NAME }}
          path: dist/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: waleed remix ${{ env.VERSION_NAME }}
          files: |
            dist/*.apk
            dist/*.aab
